name: Lint Check

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install notebook schema validator
        run: python -m pip install nbformat==5.10.4
      - name: Validate modules and notebook cells without executing them
        run: python scripts/validate_notebooks.py

